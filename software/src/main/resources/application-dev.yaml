spring:
  datasource:
    url: jdbc:h2:mem:st_usu;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS usuarios
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2
  cache:
    type: simple

management:
  health:
    redis:
      enabled: false

servicetrack:
  verificacao-de-credencial:
    limite-por-janela: 100

logging:
  structured:
    format:
      console: ${ST_USU_FORMATO_DE_LOG:}
  pattern:
    correlation: "[${spring.application.name:usuarios-veiculos},%X{traceId:-},%X{spanId:-},%X{correlationId:-},%X{requestId:-}] "
  level:
    com.clau.service_track.usuarios_veiculos: DEBUG
