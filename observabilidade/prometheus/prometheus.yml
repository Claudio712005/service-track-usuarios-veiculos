global:
  scrape_interval: 15s
  external_labels:
    ambiente: local

scrape_configs:

  - job_name: usuarios-veiculos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]
        labels:
          servico: service-track-usuarios-veiculos

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          servico: redis

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          servico: postgres

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
